      // --- DARK MODE LOGIC ---
      function initTheme() {
        if (
          localStorage.theme === "dark" ||
          (!("theme" in localStorage) &&
            window.matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
          themeIcon.className = "fa-solid fa-sun";
        } else {
          document.documentElement.classList.remove("dark");
          themeIcon.className = "fa-solid fa-moon";
        }
      }

      themeToggle.addEventListener("click", () => {
        if (document.documentElement.classList.contains("dark")) {
          document.documentElement.classList.remove("dark");
          localStorage.theme = "light";
          themeIcon.className = "fa-solid fa-moon";
        } else {
          document.documentElement.classList.add("dark");
          localStorage.theme = "dark";
          themeIcon.className = "fa-solid fa-sun";
        }
      });

      // --- APP INITIALIZATION ---
      function initApp() {
        initTheme();
        renderTabs();
        loadTest(0);

      // RENDER TABS
      function renderTabs() {
        tabsContainer.innerHTML = "";
        ALL_TESTS.forEach((test, idx) => {
          const button = document.createElement("button");
          button.className = `px-3.5 py-2 rounded-lg whitespace-nowrap font-medium transition-all text-xs md:text-sm ${
            idx === currentTestIndex
              ? "bg-brand-600 text-white shadow-sm"
              : "bg-slate-100 dark:bg-slate-700/60 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600"
          }`;
          button.textContent = test.title;
          button.addEventListener("click", () => {
            if (currentTestIndex !== idx) {
              currentTestIndex = idx;
              currentQuestionIndex = 0;
              renderTabs();
              loadTest(currentTestIndex);
              scrollToQuestion();
            }
          });
          tabsContainer.appendChild(button);
        });
      }

      function scrollToQuestion() {
        questionAnchor.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function loadTest(testIdx) {
        const test = ALL_TESTS[testIdx];
        if (!userAnswers[test.id]) {
          userAnswers[test.id] = {};
        }
        if (!checkedStatus[test.id]) {
          checkedStatus[test.id] = {};
        }

        currentTestTitle.textContent = test.title;
        renderQuestionGrid();
        renderQuestion();
        updateScoreBadge();
      }

      function renderQuestionGrid() {
        questionGrid.innerHTML = "";
        const test = ALL_TESTS[currentTestIndex];

        test.questions.forEach((_, idx) => {
          const btn = document.createElement("button");
          const isSelected = idx === currentQuestionIndex;
          const userAns = userAnswers[test.id][idx];
          const isChecked = checkedStatus[test.id][idx];

          let bgClasses =
            "bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-600";

          if (isChecked) {

            bgClasses = isCorrect

            bgClasses =
              "bg-brand-100 dark:bg-brand-900/50 text-brand-700 dark:text-brand-300 border-brand-300 dark:border-brand-700 font-semibold";
          }

          if (isSelected) {
            bgClasses +=
              " ring-2 ring-brand-500 ring-offset-2 dark:ring-offset-slate-800";
          }

          btn.className = `w-8 h-8 md:w-9 md:h-9 text-xs rounded-lg border flex items-center justify-center transition ${bgClasses}`;
          btn.textContent = idx + 1;
          btn.addEventListener("click", () => {
            currentQuestionIndex = idx;
            renderQuestionGrid();
            renderQuestion();
            scrollToQuestion();
          });
          questionGrid.appendChild(btn);
        });

          const isCorrectOpt = optIdx === q.answer;

          let stateClasses =
            "border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50 text-slate-700 dark:text-slate-200";

          if (isChecked) {
            if (isCorrectOpt) {
              stateClasses =
                "border-emerald-500 bg-emerald-50 dark:bg-emerald-950/40 text-emerald-900 dark:text-emerald-100 font-medium";
            } else if (isUserSelected && !isCorrectOpt) {
              stateClasses =
                "border-rose-500 bg-rose-50 dark:bg-rose-950/40 text-rose-900 dark:text-rose-100 font-medium";
            }
          }

          optionDiv.className = `p-3.5 rounded-xl border transition cursor-pointer flex items-start gap-3 ${stateClasses}`;

          let statusIcon = "";
          if (isChecked) {
            if (isCorrectOpt) {
              statusIcon = `<i class="fa-solid fa-circle-check text-emerald-600 dark:text-emerald-400 mt-0.5"></i>`;
            } else if (isUserSelected && !isCorrectOpt) {
              statusIcon = `<i class="fa-solid fa-circle-xmark text-rose-600 dark:text-rose-400 mt-0.5"></i>`;
            } else {
              statusIcon = `<div class="w-4 h-4 rounded-full border border-slate-300 dark:border-slate-600 mt-0.5"></div>`;
            }
          } else {
            statusIcon = `<div class="w-4 h-4 rounded-full border border-slate-300 dark:border-slate-600 mt-0.5"></div>`;
          }

          optionDiv.innerHTML = `
                    ${statusIcon}
                    <div class="flex-1 text-sm md:text-base leading-snug">
                        <span class="font-bold mr-1">${labels[optIdx]}.</span> ${optText}
                    </div>
                `;

          // CẬP NHẬT TẠI ĐÂY: Click phương án -> Tự kiểm tra luôn
          optionDiv.addEventListener("click", () => {
            userAnswers[testId][currentQuestionIndex] = optIdx;
            checkedStatus[testId][currentQuestionIndex] = true;
            renderQuestionGrid();
            renderQuestion();
            updateScoreBadge();
          });

          optionsContainer.appendChild(optionDiv);
        });

        if (isChecked) {
          explanationBox.classList.remove("hidden");
          const isCorrect = savedAns === q.answer;
          if (isCorrect) {
            explanationBox.className =
              "mt-6 p-4 rounded-xl border border-emerald-300 bg-emerald-50 dark:bg-emerald-950/40 text-emerald-900 dark:text-emerald-200 text-sm";
            explanationBox.innerHTML = `
                        <div class="font-bold text-emerald-700 dark:text-emerald-400 mb-1 flex items-center gap-1.5">
                            <i class="fa-solid fa-check"></i> Chính xác!
                        </div>
                        <div>${q.exp}</div>
                    `;
          } else {
            explanationBox.className =
              "mt-6 p-4 rounded-xl border border-rose-300 bg-rose-50 dark:bg-rose-950/40 text-rose-900 dark:text-rose-200 text-sm";
            explanationBox.innerHTML = `
                        <div class="font-bold text-rose-700 dark:text-rose-400 mb-1 flex items-center gap-1.5">
                            <i class="fa-solid fa-xmark"></i> Chưa đúng!
                        </div>
                        <div class="mb-1"><strong>Đáp án đúng:</strong> ${labels[q.answer]}. ${q.options[q.answer]}</div>
                        <div><strong>Giải thích:</strong> ${q.exp}</div>
                    `;
          }
        } else {
          explanationBox.classList.add("hidden");
        }

        prevBtn.disabled = currentQuestionIndex === 0;
        nextBtn.disabled = currentQuestionIndex === test.questions.length - 1;
      }

      function updateScoreBadge() {
        const test = ALL_TESTS[currentTestIndex];
        const testId = test.id;
        const checkedKeys = Object.keys(checkedStatus[testId] || {}).filter(
          (k) => checkedStatus[testId][k],
        );

        if (checkedKeys.length > 0) {
          let correctCount = 0;
          checkedKeys.forEach((k) => {
            if (userAnswers[testId][k] === test.questions[k].answer) {
              correctCount++;
            }
          });
          scoreText.textContent = `${correctCount}/${test.questions.length}`;
          scoreBadge.classList.remove("hidden");
        } else {
          scoreBadge.classList.add("hidden");
        }
      }

      prevBtn.addEventListener("click", () => {
        if (currentQuestionIndex > 0) {
          currentQuestionIndex--;
          renderQuestionGrid();
          renderQuestion();
          scrollToQuestion();
        }
      });

      nextBtn.addEventListener("click", () => {
        const test = ALL_TESTS[currentTestIndex];
        if (currentQuestionIndex < test.questions.length - 1) {
          currentQuestionIndex++;
          renderQuestionGrid();
          renderQuestion();
          scrollToQuestion();
        }
      });

      resetBtn.addEventListener("click", () => {
        if (
          confirm("Bạn có chắc chắn muốn xóa hết lựa chọn và làm lại đề này?")
        ) {
          const testId = ALL_TESTS[currentTestIndex].id;
          userAnswers[testId] = {};
          checkedStatus[testId] = {};
          currentQuestionIndex = 0;
          renderQuestionGrid();
          renderQuestion();
          updateScoreBadge();
          scrollToQuestion();
        }
      });

      document.addEventListener("DOMContentLoaded", initApp);
    </script>
  </body>
</html>
